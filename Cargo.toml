[workspace]
resolver = "3"
members = ["src-tauri", "core", "core/ffi", "ps", "xbox"]
# `cargo build` / `cargo test` at the top build the desktop app (and its core); the phone library
# (core/ffi) is built on its own: see core/README.md
default-members = ["src-tauri", "core", "core/ffi", "ps", "xbox"]

[workspace.package]
# the app's version (the release workflow sets it from the tag)
version = "1.5.0"

# Optimise dependencies even in debug builds (image scaling and ONNX glue are slow unoptimised).
[profile.dev.package."*"]
opt-level = 2

# our own pixel loops (preview shrinking, OCR prep) need some optimisation even in dev builds
[profile.dev]
opt-level = 1
